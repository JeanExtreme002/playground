name: Deploy no GitHub Pages

# Toda vez que algo entra na branch main, o site e reconstruido e publicado.
on:
  push:
    branches: [main]
  workflow_dispatch: # permite rodar manualmente pela aba "Actions"

# Permissoes que o robo do GitHub precisa para publicar a pagina.
permissions:
  contents: read
  pages: write
  id-token: write

# Se dois deploys comecarem juntos, o mais novo vence.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build do site
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Preparar o Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar as dependencias
        run: npm ci

      # De proposito NAO rodamos os testes aqui: eles ficam no ci.yml, que roda
      # nos Pull Requests. Assim um teste quebrado nunca impede o site de subir.
      - name: Gerar os arquivos do site
        run: npm run build

      - name: Empacotar a pasta dist
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Publicar
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
