name: Apagar a branch do PR

# Quando um Pull Request e fechado (com merge ou sem), a branch dele ja cumpriu
# o papel dela e so ficaria ocupando espaco na lista de branches. Este workflow
# apaga essa branch sozinho.
#
# Nada disso mexe no site nem na main: o que e apagado e apenas o "galho" que
# foi criado para o PR. O historico do merge continua na main, e da para
# restaurar a branch pelo proprio Pull Request ("Restore branch") se precisar.
on:
  pull_request:
    types: [closed]

# Apagar uma branch e uma escrita no repositorio, entao aqui o token precisa de
# permissao de escrita em `contents` (nos outros workflows ele e so de leitura).
permissions:
  contents: write

jobs:
  apagar:
    name: Apagar a branch
    runs-on: ubuntu-latest

    # Duas situacoes em que NAO queremos apagar nada:
    #  - o PR veio de um fork: a branch e de outra pessoa, em outro repositorio;
    #  - a branch e a padrao do repositorio (main), que nunca deve ser apagada.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref != github.event.repository.default_branch

    steps:
      - name: Apagar a branch do Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A branch entra como variavel de ambiente, e nao interpolada direto no
          # script, porque o nome dela e escrito por quem abriu o PR.
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          echo "Apagando a branch: $BRANCH"

          gh api \
            --method DELETE \
            "repos/${{ github.repository }}/git/refs/heads/$BRANCH"

          echo "Branch \`$BRANCH\` apagada." >> "$GITHUB_STEP_SUMMARY"
